<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- Applies the saved theme before the stylesheet paints so there is no flash. Same key as src/lib/theme/theme.ts. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f8fc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Family Budget</title>
    <meta name="description" content="A family budget app for households that share money: transactions, scheduled payments, bank file import and spending charts, in Hebrew and English." />
    <meta property="og:title" content="Family Budget" />
    <meta property="og:description" content="One shared ledger for the household: transactions, scheduled payments, bank file import and spending charts." />
    <meta property="og:type" content="website" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
